# Set line length limit to 100 characters
line-length = 100

# Enable preview mode to use DOC (pydoclint) rules
preview = true

exclude = [
    ".venv",
]

[lint]
# Enable recommended best practice rulesets
select = [
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # Ruff-specific rules
    "D",    # pydocstyle
    "DOC",  # pydoclint
]

[lint.pydocstyle]
convention = "google"

[lint.isort]
# `helpers` is the notebook-local module in notebooks/
known-first-party = ["bznames", "helpers"]

[lint.per-file-ignores]
# Notebook helpers are scratch presentation code — no docstring ceremony required.
# S101 (assert) is a legitimate invariant/equivalence check in these teaching
# notebooks, and S105 is a false positive on the SPECIAL_TOKEN = "." sentinel;
# both S rules are layered on by the static-review hook, not the project config.
"notebooks/*" = ["D", "DOC", "S101", "S105"]